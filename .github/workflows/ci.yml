name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build .
      # Existing CLI tests share flag state and include public-relay requests.
      # Keep this regression suite independent of those tests and Go vet's
      # pre-existing non-constant-format diagnostics.
      - run: go test -vet=off . -run 'TestResolvePetname|TestParsePubKey' -count=1
